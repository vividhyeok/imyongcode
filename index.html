<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="정보·컴퓨터 임용용 C/Python 빠른 복습과 진단 웹앱" />
  <title>ImyongCode — C/Python 빠른 복습</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-route="home" aria-label="홈으로">
        <span class="brand-mark">&gt;_</span>
        <span>
          <strong>ImyongCode</strong>
          <small>C / Python 빠른 복습</small>
        </span>
      </button>
      <div class="top-actions">
        <button class="icon-btn" id="themeToggle" title="테마 전환" aria-label="테마 전환">◐</button>
        <a class="ghost-link" href="https://github.com/vividhyeok/imyongcode" target="_blank" rel="noreferrer">GitHub</a>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav class="nav-list" aria-label="학습 메뉴">
          <button class="nav-item active" data-route="home"><span>⌂</span> 홈</button>
          <button class="nav-item" data-route="review"><span>↻</span> 빠른 훑기</button>
          <button class="nav-item" data-route="diagnostic"><span>✓</span> 진단</button>
          <button class="nav-item" data-route="weak"><span>◎</span> 약점</button>
        </nav>

        <div class="sidebar-note">
          <strong>공부 규칙</strong>
          <p>10초 안에 떠오르면 넘기고, 실행하기 전에 먼저 종이로 추적.</p>
        </div>
      </aside>

      <main id="app" class="main" tabindex="-1"></main>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
